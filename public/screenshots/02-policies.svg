  <text x="844" y="361" fill="#ecfeff" font-family="system-ui,sans-serif" font-size="11" font-weight="600" text-anchor="middle">inner_speech</text>
  <rect x="916" y="340" width="140" height="32" rx="16" fill="#0e7490"/>
  <text x="986" y="361" fill="#ecfeff" font-family="system-ui,sans-serif" font-size="11" font-weight="600" text-anchor="middle">private_thought</text>
  <rect x="784" y="388" width="90" height="32" rx="16" fill="#17202b" stroke="#243041"/>
  <text x="829" y="409" fill="#8b9bb0" font-family="system-ui,sans-serif" font-size="11" font-weight="600" text-anchor="middle">pointer</text>
  <rect x="886" y="388" width="80" height="32" rx="16" fill="#17202b" stroke="#243041"/>
  <text x="926" y="409" fill="#8b9bb0" font-family="system-ui,sans-serif" font-size="11" font-weight="600" text-anchor="middle">click</text>
  <rect x="978" y="388" width="80" height="32" rx="16" fill="#17202b" stroke="#243041"/>
  <text x="1018" y="409" fill="#8b9bb0" font-family="system-ui,sans-serif" font-size="11" font-weight="600" text-anchor="middle">type</text>

  <text x="784" y="460" fill="#8b9bb0" font-family="system-ui,sans-serif" font-size="12">Mental passphrase (demo)</text>
  <rect x="784" y="475" width="310" height="40" rx="10" fill="#070a0f" stroke="#243041"/>
  <text x="800" y="500" fill="#67e8f9" font-family="ui-monospace,monospace" font-size="14">focus</text>
